name: Build Indonesian Anime Extensions

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Indonesian Extensions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build All Indonesian Extensions
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Create Extension Repo (index.min.json)
        id: create_repo
        run: |
          mkdir -p repo/apk repo/icon dist
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "COMMIT_SHA=$SHORT_SHA" >> $GITHUB_ENV

          # Copy APKs to repo/apk and dist/
          find src/id -type f -name "*.apk" | while read -r apk; do
            ext_name=$(echo "$apk" | awk -F'/' '{print $3}')
            target_name="aniyomi-id-${ext_name}.apk"
            echo "Copying $apk -> repo/apk/$target_name"
            cp "$apk" "repo/apk/$target_name"
            cp "$apk" "dist/aniyomi-id-${ext_name}-v${SHORT_SHA}.apk"
          done

          # Download Inspector and generate index.min.json
          echo "Downloading Inspector..."
          INSPECTOR_LINK=$(curl -s "https://api.github.com/repos/komikku-app/aniyomi-extensions-inspector/releases/latest" | jq -r '.assets[0].browser_download_url')
          curl -L "$INSPECTOR_LINK" -o ./Inspector.jar
          java -jar ./Inspector.jar "repo/apk" "output.json" "tmp"

          echo "Generating repo metadata..."
          python ./.github/scripts/create-repo.py

          # Checksum
          cd dist
          sha256sum *.apk > sha256sums.txt
          CHECKSUMS=$(cat sha256sums.txt)
          cd ..

          echo "CHECKSUMS<<EOF" >> $GITHUB_ENV
          echo "$CHECKSUMS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Deploy Repo to GitHub (branch: repo)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: repo
          publish_dir: ./repo
          keep_files: false

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Indonesian-Extensions-${{ env.COMMIT_SHA }}
          path: dist/*
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: extensions-${{ env.COMMIT_SHA }}
          name: Indonesian Anime Extensions (${{ env.COMMIT_SHA }})
          body: |
            ### 🇮🇩 Indonesian Anime Extensions

            - **Commit**: [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            - **Extension Repo Raw JSON**:
              `https://raw.githubusercontent.com/${{ github.repository }}/repo/index.min.json`

            #### Checksums (SHA-256):
            ```text
            ${{ env.CHECKSUMS }}
            ```
          files: |
            dist/*.apk
            dist/sha256sums.txt
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
