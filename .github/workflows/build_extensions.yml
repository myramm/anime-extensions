name: Build Indonesian Anime Extensions

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build and Test Indonesian Extensions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and Test Extensions
        run: |
          chmod +x gradlew
          MODULES=$(find src/id -mindepth 1 -maxdepth 1 -type d | sort | awk -F'/' '{print ":src:id:" $3 ":assembleDebug"}' | tr '\n' ' ')
          echo "Building target modules: $MODULES"
          ./gradlew $MODULES -x spotlessCheck -x spotlessKotlin -x lint --no-daemon --stacktrace

      - name: Generate Extension Repo (index.min.json & repo.json)
        id: create_repo
        run: |
          mkdir -p repo/apk repo/icon dist tmp
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "COMMIT_SHA=$SHORT_SHA" >> $GITHUB_ENV

          # Copy APKs
          find src/id -type f -name "*.apk" | while read -r apk; do
            ext_name=$(echo "$apk" | awk -F'/' '{print $3}')
            target_name="aniyomi-id-${ext_name}.apk"
            echo "Copying $apk -> repo/apk/$target_name"
            cp "$apk" "repo/apk/$target_name"
            cp "$apk" "dist/aniyomi-id-${ext_name}-v${SHORT_SHA}.apk"
          done

          # Download Inspector and generate metadata
          echo "Downloading Inspector.jar..."
          curl -L -s "https://github.com/komikku-app/aniyomi-extensions-inspector/releases/download/v1.4.1/Inspector.jar" -o ./Inspector.jar || true
          if [ -f "./Inspector.jar" ]; then
            java -jar ./Inspector.jar "repo/apk" "output.json" "tmp" || echo "{}" > output.json
          else
            echo "{}" > output.json
          fi

          echo "Running create-repo.py..."
          python ./.github/scripts/create-repo.py

          # Checksums
          cd dist
          if ls *.apk 1> /dev/null 2>&1; then
            sha256sum *.apk > sha256sums.txt
            CHECKSUMS=$(cat sha256sums.txt)
          else
            CHECKSUMS="No APK built"
          fi
          cd ..

          echo "CHECKSUMS<<EOF" >> $GITHUB_ENV
          echo "$CHECKSUMS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Deploy to local repo branch
        run: |
          cd repo
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git init
          git checkout -B repo
          git add -A
          git commit -m "Deploy extension repo [skip ci]"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push -f origin repo
          cd ..

      - name: Deploy to anime-repo (myramm/anime-repo)
        env:
          GH_PAT: ${{ secrets.GH_PAT || secrets.BOT_PAT }}
        run: |
          if [ -n "$GH_PAT" ]; then
            echo "Syncing build artifacts with https://github.com/myramm/anime-repo (branch: repo)..."
            rm -rf anime-repo-remote
            git clone "https://x-access-token:${GH_PAT}@github.com/myramm/anime-repo.git" anime-repo-remote --branch repo --depth 1 || \
            git clone "https://x-access-token:${GH_PAT}@github.com/myramm/anime-repo.git" anime-repo-remote
            
            cd anime-repo-remote
            git checkout -B repo
            
            # Merge local built repo into anime-repo
            python ../.github/scripts/merge-repo.py '["id.animasu","id.animeindo","id.kuronime","id.minioppai","id.nimegami","id.otakudesu"]' 'repo'
            
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "Update extensions repo: add animasu and update id extensions [skip ci]"
              git push origin repo
              echo "Successfully pushed updates to myramm/anime-repo!"
            else
              echo "No changes to commit in myramm/anime-repo."
            fi
            cd ..
          else
            echo "Warning: GH_PAT / BOT_PAT secret is not set. Skipping push to myramm/anime-repo."
          fi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Indonesian-Extensions-${{ env.COMMIT_SHA }}
          path: dist/*
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: extensions-${{ env.COMMIT_SHA }}
          name: Indonesian Anime Extensions (${{ env.COMMIT_SHA }})
          body: |
            ### 🇮🇩 Indonesian Anime Extensions

            - **Commit**: [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            - **Anime Repo URL**:
              `https://raw.githubusercontent.com/myramm/anime-repo/repo/index.min.json`
            - **Extensions Repo URL**:
              `https://raw.githubusercontent.com/${{ github.repository }}/repo/index.min.json`
            - **Repo Metadata**:
              `https://raw.githubusercontent.com/myramm/anime-repo/repo/repo.json`

            #### Checksums (SHA-256):
            ```text
            ${{ env.CHECKSUMS }}
            ```
          files: |
            dist/*.apk
            dist/sha256sums.txt
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
